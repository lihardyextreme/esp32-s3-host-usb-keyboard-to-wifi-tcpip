[platformio]
extra_configs = 
    .platformio.ini

[common]
keyboard_flags =
  -D KEYBOARD_MODE=2

wifi_flags =
  -D WIFI_SSID=${wifi.ssid}
  -D WIFI_PASSWORD=${wifi.password}

# https://github.com/ESP32Async/AsyncTCP#important-recommendations
tcpip_flags =
  -D CONFIG_ASYNC_TCP_MAX_ACK_TIME=5000
  -D CONFIG_ASYNC_TCP_PRIORITY=10
  -D CONFIG_ASYNC_TCP_QUEUE_SIZE=64
  -D CONFIG_ASYNC_TCP_RUNNING_CORE=1
  -D CONFIG_ASYNC_TCP_STACK_SIZE=4096 

[base]
platform = espressif32
framework = arduino

[env:esp32-s3-devkitc-1-n16r8]
extends = base
# https://raw.githubusercontent.com/sivar2311/platformio_boards/refs/heads/main/esp32-s3-devkitc1-n16r8.json
# rename to esp32-s3-devkitc-1-n16r8.json
board = esp32-s3-devkitc-1-n16r8

board_build.extra_flags = ${common.keyboard_flags} ${common.wifi_flags} ${common.tcpip_flags}

upload_port = /dev/ttyACM0

lib_deps =
    ; ESP32 USB Host HID - Arduino port of ESP-IDF USB Host HID
    https://github.com/esp32beans/ESP32_USB_Host_HID.git
    ESP32Async/AsyncTCP









